# Replace example paths and hostname in the installation's private config.
upstream rsi_origin {
    server unix:/srv/forecasts/rsi/site.sock;
}
server {
    listen 443 ssl;
    server_name rsi.example.org;
    ssl_certificate /etc/ssl/dashboard/fullchain.pem;
    ssl_certificate_key /etc/ssl/dashboard/key.pem;

    auth_basic "Forecasting dashboard";
    auth_basic_user_file /etc/nginx/dashboard-passwords/rsi;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_set_header Authorization "";
        proxy_pass http://rsi_origin;
    }
}
