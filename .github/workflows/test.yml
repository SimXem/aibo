# The test suite on every PR and on main. No secrets: nothing in tests/ needs
# an API key (the build stage is stdlib-only, and redlines/llm.py imports its
# provider client inside the call). Actions are pinned by commit.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
