[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastbench-submission"
version = "0.1.0"
description = "ForecastBench rounds: members (run), sets (build) and their leaderboard names"
requires-python = ">=3.11"
# Google authentication for uploads, plus the engine installed beside it
# (pip install -e ../../packages/forecaster).
dependencies = ["google-auth[requests]>=2.38,<3"]

[tool.setuptools]
packages = ["forecastbench"]
