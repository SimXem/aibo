# Wave 1b = wave 1 (same T0, seed, sample sizes and models, hence the same sample and statements)
# with every model at effort "high". Wave 1 used each vendor's default effort, which is "medium" on
# Claude Opus 5.5 and GPT-6.1 Sol. A model whose training cutoff is later than T0 cannot join.
# Model IDs, cutoffs and effort levels checked on 2026-11-04 against the vendors' model pages:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/models/overview
#   OpenAI:    https://developers.openai.com/api/docs/models/gpt-6.1-sol
wave: wave1b
rules_version: rules_v1
seed: wave1-2026-11-03     # same seed as wave1 -> identical sample
t0: '2026-06-30'          # = latest training cutoff among the models below, last day of month
n_total: 60
n_guaranteed_solved: 10
n_samples: 5
default_effort: high      # used for every model without its own `effort`; 'default' = vendor default (not sent)

models:
  - id: claude-opus-5-5
    provider: anthropic
    training_cutoff: '2026-06'
    cutoff_source: 'Anthropic models overview, "Training data cutoff: Jun 2026" (checked 2026-11-04)'
  - id: claude-sonnet-5-5
    provider: anthropic
    training_cutoff: '2026-06'
    cutoff_source: 'Anthropic models overview, "Training data cutoff: Jun 2026" (checked 2026-11-04)'
  - id: claude-fable-5-1
    provider: anthropic
    training_cutoff: '2026-06'
    cutoff_source: 'Anthropic models overview, "Training data cutoff: Jun 2026" (checked 2026-11-04)'
  - id: gpt-6.1-sol
    provider: openai
    training_cutoff: '2026-04'
    cutoff_source: 'OpenAI model page, "Apr 30, 2026 knowledge cutoff" (checked 2026-11-04)'

statements:
  drafter: {provider: anthropic, id: claude-opus-5-5, effort: high, max_words: 50}
  template: templates/v1/statement_draft.txt
